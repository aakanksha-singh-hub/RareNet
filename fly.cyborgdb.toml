# Fly.io configuration for CyborgDB service
# Deploy with: flyctl deploy --config fly.cyborgdb.toml

app = "rarenet-cyborgdb"
primary_region = "sjc"

[build]
  dockerfile = "cyborgdb.Dockerfile"

[env]
  CYBORGDB_DB_TYPE = "redis"
  # Set CYBORGDB_CONNECTION_STRING via secrets or fly.io Redis

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[checks]
  [checks.health]
    port = 8000
    type = "http"
    interval = "30s"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

